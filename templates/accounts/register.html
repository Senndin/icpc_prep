{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width:520px">
  <h1 class="h3 fw-bold text-center mb-3">Реєстрація студента</h1>
  <div class="card">
    <form method="post">{% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button class="btn btn-primary w-100"><i class="bi bi-person-plus"></i> Зареєструватися</button>
    </form>
    <p class="text-center mt-3 mb-0">Вже маєте обліковий запис? <a href="{% url 'accounts:login' %}">Увійти</a></p>
  </div>
</div>
{% endblock %}
