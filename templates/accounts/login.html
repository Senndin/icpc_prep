{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="text-center mb-4">
    <span class="display-5 text-warning"><i class="bi bi-trophy-fill"></i></span>
    <h1 class="h3 fw-bold mt-2">ICPC Prep</h1>
    <p class="text-muted">Платформа підготовки студентів до олімпіад з програмування</p>
  </div>
  <div class="card">
    <form method="post">{% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger"><i class="bi bi-x-octagon-fill"></i> Невірний логін або пароль.</div>{% endif %}
      <div class="mb-3"><label class="form-label fw-semibold" for="id_username">Логін</label>
        <input class="form-control" type="text" name="username" id="id_username" required autofocus></div>
      <div class="mb-3"><label class="form-label fw-semibold" for="id_password">Пароль</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Увійти</button>
    </form>
    <p class="text-center mt-3 mb-0">Немає облікового запису? <a href="{% url 'accounts:register' %}">Зареєструватися</a></p>
  </div>
</div>
{% endblock %}
