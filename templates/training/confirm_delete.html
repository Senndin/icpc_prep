{% extends "base.html" %}
{% block title %}Підтвердження видалення{% endblock %}
{% block content %}
<div class="card mt-5 mx-auto" style="max-width:520px"><div class="card-body p-4">
  <h2 class="h5"><i class="bi bi-exclamation-triangle text-danger"></i> Підтвердження видалення</h2>
  <p>Ви дійсно бажаєте видалити «<strong>{{ object }}</strong>»? Цю дію неможливо скасувати.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger"><i class="bi bi-trash"></i> Видалити</button>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Скасувати</a>
  </form>
</div></div>
{% endblock %}
